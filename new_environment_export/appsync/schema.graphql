type Subscription {
  onAddChatToken(CallId: ID!, MessageId: ID!): ChatToken @aws_subscribe(mutations : ["addChatToken"])
  onAddTranscriptSegment(CallId: ID, Channel: String): TranscriptSegment @aws_subscribe(mutations : ["addTranscriptSegment"])
  onCreateCall: CreateCallOutput @aws_subscribe(mutations : ["createCall"])
  onDeleteCall: DeleteCallOutput @aws_subscribe(mutations : ["deleteCall"])
  onSendChatMessage(CallId: ID): SendChatMessageOutput @aws_subscribe(mutations : ["sendChatMessage"])
  onShareMeetings: ShareMeetingsOutput @aws_subscribe(mutations : ["shareMeetings"])
  onUnshareCall: UnshareCallOutput @aws_subscribe(mutations : ["unshareCall"])
  onUpdateCall(CallId: ID): Call @aws_subscribe(mutations : ["updateCallStatus", "updateCallAggregation", "updateRecordingUrl", "updatePcaUrl", "updateAgent", "addCallCategory", "addIssuesDetected", "addCallSummaryText"])
  onUpdateVirtualParticipant: VirtualParticipant @aws_subscribe(mutations : ["updateVirtualParticipant", "endVirtualParticipant"])
  onVNCPreviewToggle(CallId: ID!): VNCPreviewControl @aws_subscribe(mutations : ["toggleVNCPreview"])
}

